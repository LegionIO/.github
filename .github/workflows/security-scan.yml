name: Security Scan

on:
  workflow_call:
    inputs:
      ruby-version:
        description: Ruby version to use for scanning
        default: '3.4'
        type: string
        required: false
      runner:
        description: "Runner label (set to 'legion' for self-hosted, 'ubuntu-latest' for GitHub-hosted)"
        default: 'ubuntu-latest'
        type: string
        required: false
      brakeman-enabled:
        description: Run Brakeman SAST scan (enable for gems with API/Sinatra routes)
        default: false
        type: boolean
        required: false
      companion-gems:
        description: JSON mapping of companion directory names to same-owner repository and full commit ref
        default: '{}'
        type: string
        required: false

jobs:
  bundler-audit:
    name: Bundler Audit
    timeout-minutes: 10
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - name: Check out companion gems
        if: ${{ inputs.companion-gems != '' && inputs.companion-gems != '{}' }}
        uses: LegionIO/.github/actions/companion-gems@ef14bb68db4bc530509f5c31b1de364a5575a16b
        with:
          repositories: ${{ inputs.companion-gems }}
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ inputs.ruby-version }}
          bundler-cache: true
      - name: Install bundler-audit
        run: gem install bundler-audit
      - name: Run bundler-audit
        run: bundler-audit check --update

  brakeman:
    if: ${{ inputs.brakeman-enabled }}
    name: Brakeman
    timeout-minutes: 10
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - name: Check out companion gems
        if: ${{ inputs.companion-gems != '' && inputs.companion-gems != '{}' }}
        uses: LegionIO/.github/actions/companion-gems@ef14bb68db4bc530509f5c31b1de364a5575a16b
        with:
          repositories: ${{ inputs.companion-gems }}
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ inputs.ruby-version }}
          bundler-cache: true
      - name: Install Brakeman
        run: gem install brakeman
      - name: Run Brakeman
        run: brakeman --no-pager --format json --confidence-level 2
